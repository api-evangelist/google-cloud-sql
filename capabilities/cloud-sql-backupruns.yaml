naftiko: 1.0.0-alpha2
info:
  label: Google Cloud SQL Admin API — BackupRuns
  description: 'Google Cloud SQL Admin API — BackupRuns. 1 operations. Lead operation: Google Cloud SQL List backup runs.
    Self-contained Naftiko capability covering one Google Cloud Sql business surface.'
  tags:
  - Google Cloud Sql
  - BackupRuns
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_SQL_API_KEY: GOOGLE_CLOUD_SQL_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-sql-backupruns
    baseUri: https://sqladmin.googleapis.com/v1
    description: Google Cloud SQL Admin API — BackupRuns business capability. Self-contained, no shared references.
    resources:
    - name: projects-project-instances-instance-backupRuns
      path: /projects/{project}/instances/{instance}/backupRuns
      operations:
      - name: listbackupruns
        method: GET
        description: Google Cloud SQL List backup runs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: instance
          in: path
          type: string
          required: true
        - name: maxResults
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CLOUD_SQL_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-sql-backupruns-rest
    port: 8080
    description: REST adapter for Google Cloud SQL Admin API — BackupRuns. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{project}/instances/{instance}/backupruns
      name: projects-project-instances-instance-backupruns
      description: REST surface for projects-project-instances-instance-backupRuns.
      operations:
      - method: GET
        name: listbackupruns
        description: Google Cloud SQL List backup runs
        call: cloud-sql-backupruns.listbackupruns
        with:
          project: rest.project
          instance: rest.instance
          maxResults: rest.maxResults
          pageToken: rest.pageToken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-sql-backupruns-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud SQL Admin API — BackupRuns. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: google-cloud-sql-list-backup
      description: Google Cloud SQL List backup runs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-sql-backupruns.listbackupruns
      with:
        project: tools.project
        instance: tools.instance
        maxResults: tools.maxResults
        pageToken: tools.pageToken
      outputParameters:
      - type: object
        mapping: $.
