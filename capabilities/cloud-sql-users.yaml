naftiko: 1.0.0-alpha2
info:
  label: Google Cloud SQL Admin API — Users
  description: 'Google Cloud SQL Admin API — Users. 2 operations. Lead operation: Google Cloud SQL List users. Self-contained
    Naftiko capability covering one Google Cloud Sql business surface.'
  tags:
  - Google Cloud Sql
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GOOGLE_CLOUD_SQL_API_KEY: GOOGLE_CLOUD_SQL_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-sql-users
    baseUri: https://sqladmin.googleapis.com/v1
    description: Google Cloud SQL Admin API — Users business capability. Self-contained, no shared references.
    resources:
    - name: projects-project-instances-instance-users
      path: /projects/{project}/instances/{instance}/users
      operations:
      - name: listusers
        method: GET
        description: Google Cloud SQL List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: instance
          in: path
          type: string
          required: true
      - name: insertuser
        method: POST
        description: Google Cloud SQL Create a user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: project
          in: path
          type: string
          required: true
        - name: instance
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.GOOGLE_CLOUD_SQL_API_KEY}}'
  exposes:
  - type: rest
    namespace: cloud-sql-users-rest
    port: 8080
    description: REST adapter for Google Cloud SQL Admin API — Users. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{project}/instances/{instance}/users
      name: projects-project-instances-instance-users
      description: REST surface for projects-project-instances-instance-users.
      operations:
      - method: GET
        name: listusers
        description: Google Cloud SQL List users
        call: cloud-sql-users.listusers
        with:
          project: rest.project
          instance: rest.instance
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: insertuser
        description: Google Cloud SQL Create a user
        call: cloud-sql-users.insertuser
        with:
          project: rest.project
          instance: rest.instance
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-sql-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Google Cloud SQL Admin API — Users. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: google-cloud-sql-list-users
      description: Google Cloud SQL List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-sql-users.listusers
      with:
        project: tools.project
        instance: tools.instance
      outputParameters:
      - type: object
        mapping: $.
    - name: google-cloud-sql-create-user
      description: Google Cloud SQL Create a user
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cloud-sql-users.insertuser
      with:
        project: tools.project
        instance: tools.instance
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
