apis:
  - name: Cloud SQL Admin API
    description: The Cloud SQL Admin API provides programmatic management of Cloud SQL instances, databases, users, backup runs,
      SSL certificates, and flags. It enables automated provisioning and configuration of managed MySQL, PostgreSQL, and SQL
      Server instances, including high-availability setup, storage management, network configuration, and user access control.
