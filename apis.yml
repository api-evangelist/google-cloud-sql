aid: google-cloud-sql
name: Google Cloud SQL
description: >-
  Google Cloud SQL is a fully managed relational database service that supports MySQL, PostgreSQL, and SQL Server. It
  handles routine database tasks such as provisioning, replication, backups, and failover, allowing developers to focus
  on application development. Cloud SQL provides high availability, automatic storage scaling, and integrated security
  features.
